name: Pipeline DevSecOps CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auditoría de Dependencias (npm audit)
        run: |
          npm audit --audit-level=high

      - name: Construir imagen Docker
        run: |
          docker build -t api-fortaleza-nube:${{ github.sha }} .

      - name: Escaneo de vulnerabilidades en la imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-fortaleza-nube:${{ github.sha }}'
          format: 'table'
          trivyignores: '.trivyignore'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: security-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Despliegue mediante SSH a AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app/api
            git pull origin main
            docker compose down
            docker compose up -d --build
